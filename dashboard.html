<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <!-- top navbar, has the app name and logout button -->
    <nav class="navbar navbar-dark app-navbar px-3">
        <span class="navbar-brand mb-0 h1">FitTrack Dashboard</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- sidebar nav, only Overview is active, the rest are just placeholders for now -->
            <aside class="col-md-3 col-lg-2 app-sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#">Overview</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Workouts</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Goals</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
                </ul>
            </aside>

            <main class="col-md-9 col-lg-10 p-4">

                <h2 id="greeting" class="mb-4">Welcome back, <span id="usernameDisplay"></span></h2>

                <!-- 4 stat cards, the -- placeholders get replaced with real values from dashboard.js -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-6 col-lg-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h6 id="stat1-title" class="stat-title">Steps Today</h6>
                                <h3 id="stat1-value" class="stat-value">--</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h6 id="stat2-title" class="stat-title">Calories Burned</h6>
                                <h3 id="stat2-value" class="stat-value">--</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h6 id="stat3-title" class="stat-title">Workouts This Week</h6>
                                <h3 id="stat3-value" class="stat-value">--</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h6 id="stat4-title" class="stat-title">Avg Heart Rate</h6>
                                <h3 id="stat4-value" class="stat-value">--</h3>
                            </div>
                        </div>
                    </div>
                </div>
                 <!-- table showing sample workout history, filled in by dashboard.js too -->
                <div class="card">
                    <div class="card-header app-card-header">Recent Workout Activity</div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Workout</th>
                                    <th>Duration</th>
                                    <th>Calories</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody">
                                <!-- rows get inserted here by js, empty by default -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
