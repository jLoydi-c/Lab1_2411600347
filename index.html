<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Login</title>

     <!-- bootstrap cdn so I don't have to write all the css myself -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

      <!-- centers the login card in the middle of the screen -->
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card shadow-lg">
            <!-- header part of the card, just the app name -->
            <div class="card-header login-header text-center">
                <h2>FitTrack</h2>
                <p class="mb-0">Personal Fitness Dashboard</p>
            </div>
            <div class="card-body p-4">

                <!-- error message, hidden by default, js turns this on if login fails -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password">
                </div>
                <!-- type is button not submit, so it doesn't reload the page and js can handle the login -->
                <button type="button" id="loginBtn" class="btn btn-login w-100">Log In</button>
                <!-- just here so I remember what to type in when testing -->
                <p class="text-center mt-3 text-muted small">Demo credential: admin / admin123</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
